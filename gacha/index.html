      let last = performance.now();
      const step = now => {
        const dt = Math.min(48, now - last); last = now;
        const k = dt / 16.67;
        this.ctx.clearRect(0,0,this.w,this.h);
        for(let i=this.parts.length-1;i>=0;i--){
          const p = this.parts[i];
          p.life += dt;
          if(p.life >= p.max){ this.parts.splice(i,1); continue; }
          p.x += p.vx*k; p.y += p.vy*k;
          p.vy += p.grav*k; p.vx *= 0.985;
          const t = 1 - p.life/p.max;
          this.ctx.globalAlpha = Math.max(0, t);
          this.ctx.fillStyle = p.col;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size*(0.6+0.6*t), 0, Math.PI*2);
          this.ctx.fill();
        }
        this.ctx.globalAlpha = 1;
        if(this.parts.length){ this.raf = requestAnimationFrame(step); }
        else { this.raf = 0; this.ctx.clearRect(0,0,this.w,this.h); }
      };
      this.raf = requestAnimationFrame(step);
    }
  };

  function centerOf(el){
    const r = el.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2, r };
  }

  /* =========================================================
     演出の小道具
     ========================================================= */
  function shake(){
    world.classList.remove('shk');
    void world.offsetWidth;
    world.classList.add('shk');
    setTimeout(()=>world.classList.remove('shk'), 360);
  }
  function flash(){
    const f = $('#flash');
    f.classList.remove('on');
    void f.offsetWidth;
    f.classList.add('on');
    setTimeout(()=>f.classList.remove('on'), 240);
  }
  function ringAt(el, color, scale){
    const c = centerOf(el);
    const g = $('#gridwrap').getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'ring';
    d.style.left = (c.x - (g.left - stage.getBoundingClientRect().left)) + 'px';
    d.style.top  = (c.y - (g.top - stage.getBoundingClientRect().top)) + 'px';
    d.style.borderColor = color || '#fff';
    if(scale) d.style.animationDuration = scale;
    gridwrap.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }
  function showPiki(card){
    const g = gridwrap.getBoundingClientRect();
    const r = card.getBoundingClientRect();
    pikiEl.style.left = (r.left - g.left + r.width/2) + 'px';
    pikiEl.style.top  = (r.top - g.top + 6) + 'px';
    pikiEl.classList.remove('on');
    void pikiEl.offsetWidth;
    pikiEl.classList.add('on');
  }

  function frontHTML(ch, rarity){
    return `<div class="fr r${rarity}">
      <div class="ico">${charSvg(ch, rarity)}</div>
      <div class="rv">${'★'.repeat(rarity)}</div>
    </div>`;
  }

  /* =========================================================
     HUD / タイマー
     ========================================================= */
  let ticking = false;
  function startTimer(){
    if(ticking) return;
    ticking = true;
    let last = 0;
    const loop = now => {
      if(S.phase !== 'pull'){ ticking = false; return; }
      if(now - last > 32){
        last = now;
        const t = S.t1 ? S.t1 : performance.now();
        $('#tTime').textContent = secs(t - S.t0);
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  function hud(){
    $('#tCount').textContent = S.pulls;
    $('#tDia').textContent = nf(S.dia);
    const t = S.t1 ? S.t1 : performance.now();
    $('#tTime').textContent = secs(t - S.t0);
  }

  /* =========================================================
     抽選
     ========================================================= */
  function rollRarity(){
    const x = Math.random();
    if(x < 0.02) return 5;
    if(x < 0.20) return 4;
    return 3;
  }
  function drawChar(r){
    return r === 5 ? pick(P5) : r === 4 ? pick(P4) : pick(P3);
  }
  function makePull(){
    let cards;
    if(S.forced.length){
      const f = S.forced.shift();
      cards = f.map(k => ({ key: (CHARS[k] ? k : drawChar(rollRarity())) }));
    }else{
      cards = [];
      for(let i=0;i<10;i++){
        const r = rollRarity();
        cards.push({ key: drawChar(r) });
      }
    }
    // 虹ロード：最初の10連の10枚目が確定虹
    if(S.rainbowRoad && S.tens === 1 && !S.hits.length){
      cards[9] = { key: pick(P5), road:true };
    }
    // 天井：100連目の最後で★5確定救済
    if(!S.hits.length && S.pulls + 10 >= 100){
      cards[9] = { key: pick(P5), ceil:true };
    }
    // 昇格フラグ
    cards.forEach(c => {
      if(CHARS[c.key].r === 5){
        c.promo = !!(c.road || c.ceil) || Math.random() < 0.55;
        c.from = Math.random() < 0.3 ? 3 : 4;
      }else{
        c.promo = false;
      }
    });
    return cards;
  }

  /* =========================================================
     10連の実行
     ========================================================= */
  function buildGrid(){
    grid.innerHTML = '';
    for(let i=0;i<10;i++){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="inner">
        <div class="face back"></div>
        <div class="face front"></div>
      </div>`;
      grid.appendChild(card);
    }
  }

  async function lightIntro(){
    const l = $('#light');
    l.classList.remove('on');
    void l.offsetWidth;
    l.classList.add('on');
    Sfx.coin();
    await wait(430);
    l.classList.remove('on');
    await wait(110);
  }

  function recordHit(ch, card, c){
    if(!S.hits.length){
      S.hitPulls = S.pulls;
      S.t1 = performance.now();
      if(c.road) S.rainbowRoadHit = true;
      if(c.ceil) S.ceilHit = true;
    }
    S.hits.push(S.hits.some(h=>h.name===ch.name) ? Object.assign({}, ch) : ch);
    S.lastName = ch.name;
  }

  function showHit(ch, tag, c){
    $('#hitTag').textContent = tag;
    $('#hitR').textContent = '★★★★★';
    $('#hitName').textContent = ch.name;
    $('#hitKana').textContent = ch.kana + ' ／ ' + ch.role;
    $('#hitLine').textContent = '「' + ch.line + '」';
    $('#hitArt').innerHTML = charSvg(ch, 5);
    hitEl.classList.remove('on');
    void hitEl.offsetWidth;
    hitEl.classList.add('on');
  }

  async function rainbowReveal(card, ch, c, promoted){
    card.classList.remove('charging');
    card.classList.add('pop');
    const p = centerPos(card);
    FX.burst(p.x, p.y, { n: promoted ? 46 : 32, speed: 4.4, life: 800, lift: 1.1 });
    Sfx.rainbow();
    ringAt(card, c.ceil ? '#ffe27a' : '#fff', promoted ? '.8s' : '.6s');
    if(promoted) flash();

    const hitIndex = S.hits.length;
    recordHit(ch, card, c);
    let tag = '★5 GET!!';
    if(c.ceil) tag = '天井到達！★5確定救済';
    else if(c.road) tag = '🌈 虹ロード確定演出！';
    else if(hitIndex > 0) tag = '★5 二枚抜き!!';
    else if(promoted) tag = '虹昇格!! ★5';
    showHit(ch, tag, c);

    if(!S.skip){
      shake();
      await wait(promoted ? 760 : 520);
    }else{
      await wait(40);
    }
  }

  function centerPos(el){
    const r = el.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2 };
  }

  async function revealCard(i, c){
    const card = grid.children[i];
    const ch = CHARS[c.key];
    const promo = c.promo;
    const shownR = promo ? c.from : ch.r;

    card.querySelector('.front').innerHTML = frontHTML(ch, shownR);
    Sfx.flip();
    card.classList.add('flip');

    if(!promo){
      if(shownR === 5){
        await wait(S.skip ? 20 : 130);
        await rainbowReveal(card, ch, c, false);
      }else{
        await wait(S.skip ? 8 : 52);
      }
      return;
    }

    // ---- 昇格演出：一瞬止まる → ピキッ → 虹 ----
    await wait(S.skip ? 12 : 170);
    if(!S.skip){
      card.classList.add('charging');
      showPiki(card);
      Sfx.piki();
      shake();
      const p = centerPos(card);
      FX.burst(p.x, p.y, { n: 14, speed: 2.6, life: 420, colors:['#fff','#ffd24a','#8ecbff'] });
      await wait(120);
      flash();
      await wait(430);
    }else{
      await wait(10);
    }
    card.querySelector('.front').innerHTML = frontHTML(ch, 5);
    await rainbowReveal(card, ch, c, true);
  }

  async function runPull(){
    if(S.busy) return;
    S.busy = true;
    S.phase = 'pull';
    S.skip = false;
    pullEl.classList.add('show');
    titleEl.classList.remove('show');
    resEl.classList.remove('show');
    btnNext.classList.add('hide');
    btnSkip.classList.remove('hide');
    hitEl.classList.remove('on');
    if(!S.t0) S.t0 = performance.now();

    S.tens++;
    S.pulls += 10;
    S.dia += COST;
    hud();
    startTimer();

    const cards = makePull();
    buildGrid();
    $('#pHint').innerHTML = S.tens === 1 ? 'ダイヤ <b>350</b> 消費！ 10連スタート！' : '<b>' + S.tens + '回目</b>の10連！';

    await lightIntro();

    let hitsHere = 0;
    for(let i=0;i<10;i++){
      await revealCard(i, cards[i]);
      if(CHARS[cards[i].key].r === 5) hitsHere++;
    }

    if(cards.every(c => CHARS[c.key].r >= 4)) S.allGold = true;
    S.maxHits = Math.max(S.maxHits, hitsHere);

    if(hitsHere > 0){
      // ---- RTA ゴール ----
      btnSkip.classList.add('hide');
      $('#pHint').innerHTML = S.hits.length >= 2 ? '<b>★5二枚抜き!!</b> これは自慢できる！' : '<b>★5 GET!!</b> タイム確定！';
      if(!S.skip){ Sfx.fanfare(); }
      await wait(S.skip ? 60 : 900);
      S.busy = false;
      showResult();
      return;
    }

    // ---- ノーヒット：即もう10連 ----
    S.busy = false;
    S.skip = false;
    btnSkip.classList.add('hide');
    btnNext.classList.remove('hide');
    btnNext.textContent = S.pulls >= 90 ? '🎰 もう10連！（天井まであと' + (100 - S.pulls) + '連）' : '🎰 もう10連を引く！';
    const rest = 10 - hitsHere;
    $('#pHint').innerHTML = S.pulls >= 50
      ? '★5なし…<b>' + S.pulls + '連</b>。ダイヤが溶けていく……'
      : '★5なし…　でもダイヤは無限！';
    hud();
  }

  /* =========================================================
     ランク判定
     ========================================================= */
  function calcRank(){
    const pulls = S.hitPulls || S.pulls;
    if(S.maxHits >= 2){
      return { key:'SSS+', title:'伝説の★5二枚抜き神引き！', note:'同じ10連で★5が2枚以上！ これはスクショして自慢していいやつ。' };
    }
    if(S.allGold){
      return { key:'SSS+', title:'全枠金以上の神引き！', note:'10枚すべて★4以上。もうガチャの神に愛されてる。' };
    }
    if(S.rainbowRoadHit){
      return { key:'SSR', title:'虹ロード確定演出！', note:'はじめから虹の気配…10連目が確定で虹だった。' };
    }
    if(pulls <= 10) return { key:'SS', title:'豪運の10連一発ツモ！', note:'10連1回で★5。財布も心も無傷の神展開。' };
    if(pulls <= 20) return { key:'S',  title:'神引きの入り口、たしかにあった', note:'20連以内の★5はかなり優秀。' };
    if(pulls <= 30) return { key:'A',  title:'普通に強運！', note:'30連で★5。よくある、よくある…いや、じゅうぶん強い。' };
    if(pulls <= 50) return { key:'B',  title:'ふつうの課金者', note:'財布が少しだけ痩せた。' };
    if(pulls <= 70) return { key:'C',  title:'ちょっと沼った', note:'画面の前で「はよ」って言った回数、約' + Math.max(1, Math.floor(pulls/10)) + '回。' };
    if(S.ceilHit){
      return { key:'D', title:'財布が消し飛んだ爆死エンド', note:'100連天井で救済。★5は来たけど、財布はもう無い。' };
    }
    return { key:'D', title:'財布が消し飛んだ爆死エンド', note:'★5が来るまで' + pulls + '連。ダイヤは無限でも、時間と心は有限。' };
  }

  /* =========================================================
     リザルト
     ========================================================= */
  let lastRank = null;
  function showResult(){
    S.phase = 'result';
    btnNext.classList.add('hide');
    btnSkip.classList.add('hide');
    hitEl.classList.remove('on');

    const rank = calcRank();
    lastRank = rank;
    const t = (S.t1 || performance.now()) - S.t0;

    resEl.className = 'screen show rk-' + rank.key.replace('+','p');
    $('#rRank').textContent = rank.key;
    $('#rTitle').textContent = rank.title;
    $('#rNote').textContent = rank.note;

    const seen = {};
    const uniq = S.hits.filter(h => { if(seen[h.name]) return false; seen[h.name] = 1; return true; });
    const wrap = $('#rCards');
    wrap.className = 'r-cards ' + (uniq.length > 1 ? 'two' : 'one');
    wrap.innerHTML = uniq.map(h => `
      <div class="rcard">
        <div class="in">
          <div class="art">${charSvg(h, 5)}</div>
          <div class="meta">
            <div class="rr">★5 ／ ${h.role}</div>
            <div class="nm">${h.name}</div>
            <div class="ln">「${h.line}」</div>
          </div>
        </div>
      </div>`).join('');

    $('#rPulls').textContent = S.hitPulls || S.pulls;
    $('#rDia').textContent = nf(S.dia);
    $('#rTime').textContent = secs(t);

    $('#rNote').textContent = rank.note + (S.hits.length > 1 ? ' ★5は' + S.hits.length + '枚！' : '');

    const lines = uniq.map(h => '★5：' + h.name + '（' + h.role + '）').join('\n');
    const text =
      '【脳汁10連ガチャ！虹昇格RTA】\n' +
      '結果：' + rank.key + '「' + rank.title + '」\n' +
      lines + '\n' +
      (S.hitPulls || S.pulls) + '連 ／ ダイヤ' + nf(S.dia) + '消費 ／ ' + secs(t) + '秒\n' +
      '★5引くまでやめられない10連ガチャ👇\n' +
      PRICE_URL + '\n#脳汁10連ガチャ';
    btnShare.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text);

    pullEl.classList.remove('show');
    resEl.classList.add('show');

    if(rank.key === 'D'){ Sfx.boom(); }
    else if(rank.key === 'SSS+' || rank.key === 'SSR'){ Sfx.fanfare(); setTimeout(()=>Sfx.fanfare(), 420); }
    else { Sfx.fanfare(); }

    // 紙吹雪
    const p = { x: FX.w/2, y: FX.h*0.42 };
    setTimeout(()=>{
      if(rank.key === 'D') return;
      FX.burst(p.x, p.y, { n: 40, speed: 5, life: 1100, lift: 1.6, grav: 0.09 });
    }, 120);
  }

  /* =========================================================
     画面遷移・初期化
     ========================================================= */
  function rollRainbowRoad(){
    S.rainbowRoad = Math.random() < 0.04;
    titleEl.classList.toggle('aura', S.rainbowRoad);
  }

  function resetGame(){
    S.phase = 'title';
    S.rainbowRoadHit = false; S.ceilHit = false; S.allGold = false;
    S.t0 = 0; S.t1 = 0;
    S.pulls = 0; S.tens = 0; S.dia = 0;
    S.hits = []; S.hitPulls = 0; S.maxHits = 0;
    S.skip = false; S.busy = false;
    hitEl.classList.remove('on');
    pullEl.classList.remove('show');
    resEl.classList.remove('show');
    titleEl.classList.add('show');
    grid.innerHTML = '';
    hud();
    rollRainbowRoad();
  }

  function start(){
    Sfx.on();
    if(S.phase !== 'title') return;
    S.phase = 'pull';
    S.t0 = performance.now();
    S.t1 = 0;
    titleEl.classList.remove('show');
    runPull().catch(()=>{ S.busy = false; });
  }

  /* =========================================================
     イベント
     ========================================================= */
  btnStart.addEventListener('click', start);

  btnNext.addEventListener('click', () => {
    Sfx.on();
    if(S.busy || S.phase !== 'pull') return;
    runPull().catch(()=>{ S.busy = false; });
  });

  btnSkip.addEventListener('click', () => {
    Sfx.on();
    S.skip = true;
    btnSkip.classList.add('hide');
    $('#pHint').innerHTML = '<b>全めくり！</b>';
  });

  btnRetry.addEventListener('click', () => { Sfx.on(); resetGame(); });

  muteBtn.addEventListener('click', () => {
    Sfx.on();
    S.muted = !S.muted;
    Sfx.setMuted(S.muted);
    muteBtn.textContent = S.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', S.muted ? 'サウンドをオンにする' : 'サウンドをオフにする');
    try{ localStorage.setItem('gacha_muted', S.muted ? '1' : '0'); }catch(e){}
  });

  // 起動時のミュート設定復元
  try{
    if(localStorage.getItem('gacha_muted') === '1'){
      S.muted = true; Sfx.muted = true;
      muteBtn.textContent = '🔇';
    }
  }catch(e){}

  document.addEventListener('visibilitychange', () => {
    if(document.hidden && Sfx.ac && Sfx.ac.state === 'running'){ try{ Sfx.ac.suspend(); }catch(e){} }
  });

  /* =========================================================
     デバッグ用フック（検証専用。UIには出ません）
     ========================================================= */
  window.__gacha = {
    state: S,
    force(list){ S.forced = list.map(a => a.slice()); },
    rainbow(v){ S.rainbowRoad = !!v; titleEl.classList.toggle('aura', !!v); },
    fast(on){ S.skip = !!on; },
    start, reset: resetGame, calcRank
  };

  /* ---- boot ---- */
  FX.init();
  buildGrid();
  rollRainbowRoad();
  hud();
})();
</script>
</body>
</html>
